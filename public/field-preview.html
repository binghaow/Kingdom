<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城防与录音图鉴 · Kingdom</title><style>body{margin:0;background:#1b2b28;color:#e4d6b5;font:15px system-ui}main{max-width:1150px;margin:auto;padding:22px}h1{font:28px Georgia}a{color:#ddc183}button{padding:12px 18px;margin:4px;background:#344b40;color:#e8d6ae;border:1px solid #897950;border-radius:4px}canvas{width:100%;height:auto;background:#415540;border:1px solid #718367}#status{font-size:13px;color:#aec5a8}p{line-height:1.7}</style><main><h1>城防与录音图鉴 <small>FIELD NOTES</small></h1><a href="/">返回战场 →</a><p>真实录音与拟音试听 · 城墙保持统一高度，门扇绕铰链开合。</p><div id="sounds"></div><p id="status">点选一项开始试听；系统媒体音量需要开启。</p><canvas id="scene" width="1150" height="690"></canvas><p>上排：横向城墙与城门　下排：纵向城墙与城门　右侧：岩层断面</p></main><script src="visuals.js"></script><script src="natural-audio.js"></script><script src="engine.js"></script><script src="empires.js"></script><script src="coalitions.js"></script><script src="dynasties.js"></script><script src="worlds.js"></script><script src="frontiers.js"></script><script src="siege.js"></script><script src="fortification.js"></script><script src="tactics.js"></script><script src="companions.js"></script><script src="campaign.js"></script><script src="clarity.js"></script><script src="guardians.js"></script><script src="terrain.js"></script><script src="economy.js"></script><script src="wildlands.js"></script><script src="commander.js"></script><script src="network-model.js"></script><script src="network-client.js"></script><script src="maritime-art.js"></script><script src="dynasty-art.js"></script><script src="world-art.js"></script><script src="frontier-art.js"></script><script src="siege-art.js"></script><script src="companion-art.js"></script><script src="immersion-art.js"></script><script src="art-profiles.js"></script><script src="architecture-art.js"></script><script src="troop-art.js"></script><script src="unit-motion.js"></script><script src="painted-troops.js"></script><script src="painted-architecture.js"></script><script src="interaction-art.js"></script><script src="national-idle.js"></script><script src="wall-art.js"></script><script src="cliff-art.js"></script><script src="war-art.js"></script><script src="economy-art.js"></script><script src="precision-picking.js"></script><script src="terrain-art.js"></script><script src="sound-scene.js"></script><script>
const A=KingdomArt,canvas=document.getElementById('scene'),c=canvas.getContext('2d');let started=performance.now();for(const [name,kind]of [['牛叫','select-cow'],['羊叫','select-sheep'],['士兵回应','select-soldier-infantry'],['农民回应','select-villager'],['船只','select-ship'],['飞艇','select-air'],['刀剑对击','melee'],['采石','mine'],['敲木','hammer'],['战斗军号','battleHorn'],['紧急遇袭','underAttack'],['城门','gateMove']]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{A.audioStart();A.sound(kind)};document.getElementById('sounds').append(b)}
const wallScene=[...Array.from({length:5},(_,i)=>({kind:i===2?'gate':'wall',team:0,x:100+i*96,y:180,complete:true,hp:1600})),...Array.from({length:3},(_,i)=>({kind:i===1?'gatevertical':'wallvertical',team:0,x:180,y:370+i*96,complete:true,hp:1600})),...[0,1,2].map(i=>({kind:'wall',team:0,x:400+i*96,y:370,complete:true,hp:1600})),...[1,2].map(i=>({kind:'wallvertical',team:0,x:592,y:370+i*96,complete:true,hp:1600}))];A.setPresentation({state:{nations:['britain'],ages:[5],tech:[{}],buildings:wallScene}});A.ready.then(()=>{function draw(){const t=(performance.now()-started)/1000;c.fillStyle='#40583b';c.fillRect(0,0,1150,690);for(let i=0;i<600;i++){c.fillStyle=i%2?'#72905b40':'#9ca97430';c.fillRect((i*173)%1150,(i*279)%690,3,2)}c.fillStyle='#e5d6ae';c.font='18px Georgia';c.fillText('EAST / WEST',60,55);c.fillText('NORTH / SOUTH',60,255);for(const b of wallScene){b.gateOpen=(1-Math.cos(t*.7))/2;A.building(c,b,t,false,false)}for(let i=0;i<4;i++)A.drawCliff(c,{x:820,y:160+i*157,rx:135,ry:100},i);document.getElementById('status').textContent=(A.audioStatus().state==='running'?'录音播放已启用 · 可选择上方按钮试听':'点选上方按钮启用声音');requestAnimationFrame(draw)}draw()});</script></html>
