<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>一致性检查 · Consistency check</title>
<style>
:root{color-scheme:dark;--bg:#16130e;--card:#221d15;--line:#4a3f2c;--text:#f3e7c9;--muted:#b9a985;--ok:#5fd17a;--bad:#ff6b5e;--run:#e9c46a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
#overall{font-size:30px;font-weight:700;margin:8px 0 16px;padding:16px;border-radius:14px;background:var(--card);border:2px solid var(--line);text-align:center;word-break:break-word}
#overall.ok{border-color:var(--ok);color:var(--ok)}#overall.bad{border-color:var(--bad);color:var(--bad)}#overall.run{color:var(--run)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.rec h2{font-size:19px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rec .state{font-size:24px;font-weight:700}
.rec .state.ok{color:var(--ok)}.rec .state.bad{color:var(--bad)}.rec .state.run{color:var(--run)}
.rec .detail{color:var(--muted);font-size:15px;margin-top:4px;word-break:break-word}
.bar{height:6px;background:#3a3122;border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--run)}
button{font:inherit;font-size:20px;font-weight:600;width:100%;padding:16px;border-radius:12px;border:1px solid #c9a65a;background:#3b2f1a;color:var(--text);margin:8px 0}
button:active{background:#4d3d22}
#copied{text-align:center;color:var(--ok);min-height:1.4em}
details{margin-top:12px;color:var(--muted);font-size:14px}
pre{white-space:pre-wrap;word-break:break-all;background:#100d09;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:var(--text)}
</style>
</head>
<body>
<main>
<h1>真机一致性检查<br><span style="font-size:19px">Device consistency check</span></h1>
<p class="sub">在本机浏览器里用游戏同一份模拟代码回放标准录像，逐秒对照电脑上算出的标准答案。<br>Replays standard recordings with this browser's copy of the game simulation and compares every second with the answer computed on a computer.</p>
<div id="overall" class="run">准备中… Loading…</div>
<div id="list"></div>
<button id="copy" type="button" disabled>复制结果 · Copy result</button>
<div id="copied"></div>
<details><summary>设备信息与原始结果 · Device info &amp; raw result</summary><pre id="raw"></pre></details>
</main>
<!-- the simulation chain exactly as index.html loads it (engine.js ... network-model.js), the art profiles the simulation reads, then the P1 core bundle -->
<script src="engine.js"></script>
<script src="empires.js"></script>
<script src="coalitions.js"></script>
<script src="dynasties.js"></script>
<script src="worlds.js"></script>
<script src="frontiers.js"></script>
<script src="siege.js"></script>
<script src="fortification.js"></script>
<script src="tactics.js"></script>
<script src="companions.js"></script>
<script src="campaign.js"></script>
<script src="clarity.js"></script>
<script src="guardians.js"></script>
<script src="terrain.js"></script>
<script src="economy.js"></script>
<script src="wildlands.js"></script>
<script src="direction.js"></script>
<script src="commander.js"></script>
<script src="roster.js"></script>
<script src="frontier-v40.js"></script>
<script src="ai-naval-air.js"></script><script src="ai-naval-air.js"></script>
<script src="ai-humanlike.js"></script>
<script src="network-model.js"></script>
<!-- art-profiles.js is read by the simulation (siege.js building footprints for blocking), so it is part of the simulated state -->
<script src="art-profiles.js"></script>
<script src="kingdom-core.js"></script>
<script src="consistency.js"></script>
</body>
</html>
