<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>王国造型图鉴</title><style>body{background:#1d2b27;color:#e4d4ac;font:15px Georgia;margin:24px}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap}select,button{background:#31433b;color:#ead7ac;border:1px solid #8a7c59;padding:10px}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}figure{margin:0;background:radial-gradient(ellipse at 50% 80%,#4e5c44,#26372f);border:1px solid #77816855;text-align:center;padding:12px}canvas{width:240px;height:245px}figcaption{padding:5px}#status{color:#a3c9a4}</style>
<header><h1>王国造型图鉴 · KINGDOM ATLAS</h1><label>国家 <select id="nation"></select></label><label>时代 <select id="era"><option value="1">I · 开拓</option><option value="2">II · 殖民</option><option value="3">III · 城堡</option><option value="4">IV · 工业</option><option value="5" selected>V · 帝国</option></select></label><label>分类 <select id="category"><option value="all">全部</option><option value="sea">舰船</option><option value="units">人物与单位</option><option value="buildings">建筑</option></select></label><a href="/" style="color:#e5c587">返回战场 →</a></header><p id="status">正在加载造型…</p><main id="gallery"></main>
<script src="visuals.js"></script><script src="engine.js"></script><script src="empires.js"></script><script src="coalitions.js"></script><script src="dynasties.js"></script><script src="worlds.js"></script><script src="frontiers.js"></script><script src="siege.js"></script><script src="fortification.js"></script><script src="tactics.js"></script><script src="companions.js"></script><script src="campaign.js"></script><script src="maritime-art.js"></script><script src="dynasty-art.js"></script><script src="world-art.js"></script><script src="frontier-art.js"></script><script src="siege-art.js"></script><script src="companion-art.js"></script><script src="immersion-art.js"></script><script src="art-profiles.js"></script><script src="architecture-art.js"></script><script src="troop-art.js"></script><script src="unit-motion.js"></script><script src="painted-troops.js"></script><script src="painted-architecture.js"></script><script src="interaction-art.js"></script><script src="national-idle.js"></script><script src="wall-art.js"></script><script src="cliff-art.js"></script><script src="campaign-art.js"></script><script src="spell-sprites.js"></script><script src="precision-picking.js"></script><script>
const A=KingdomArt,K=KingdomSim,D=K.defs;for(const [id,n]of Object.entries(K.nations)){const o=document.createElement('option');o.value=id;o.textContent=n.name;document.querySelector('#nation').append(o)}
async function render(){await A.ready;const n=document.querySelector('#nation').value,age=+document.querySelector('#era').value;A.setPresentation({state:{nations:[n],ages:[age],tech:[{armor:2,weapons:2}]}});const main=document.querySelector('main');main.replaceChildren();try{const category=document.querySelector('#category').value;const kinds=Object.keys(D).filter(k=>(!D[k].nation||D[k].nation===n)&&(category==='all'||category==='sea'&&D[k].domain==='sea'||category==='units'&&!D[k].building||category==='buildings'&&D[k].building));kinds.sort((a,b)=>(['aerodrome','scoutballoon','airtransport','gunship'].indexOf(a)+1||99)-(['aerodrome','scoutballoon','airtransport','gunship'].indexOf(b)+1||99));for(const kind of kinds){const f=document.createElement('figure'),c=document.createElement('canvas');c.width=480;c.height=490;const g=c.getContext('2d');g.scale(2,2);const m=A.measure(kind),scale=Math.min(220/m.width,210/m.height);g.translate(120,220);g.scale(scale,scale);const e={kind,team:0,x:0,y:0,id:0,complete:true,progress:1,hp:D[kind].hp,maxhp:D[kind].hp};D[kind].building?A.building(g,e,0,false,false):A.unit(g,e,0,false);const caption=document.createElement('figcaption');caption.textContent=D[kind].name+' · '+kind;f.append(c,caption);main.append(f)}document.querySelector('#status').textContent=main.children.length+' 种造型 · '+K.nations[n].name+' · 时代 '+age+' · 已加载'}catch(e){document.querySelector('#status').textContent='绘制错误：'+e.message;throw e}}
document.querySelectorAll('select').forEach(e=>e.onchange=render);render();</script></html>
